topologia:
  servicos:
    auth:
      depends_on:
      - db
      portas:
      - 8081
      estado: null
    billing:
      depends_on:
      - db
      portas:
      - 8082
      estado: null
    collector:
      depends_on:
      - orchestrator
      - redis
      portas:
      - 8090
      estado: null
    community:
      depends_on:
      - db
      portas:
      - 8084
      estado: null
    db:
      depends_on: []
      portas:
      - 5432
      estado:
        tipo: postgres
        gerenciado_aws: RDS
    frontend:
      depends_on:
      - gateway
      portas:
      - 8080
      estado: null
    gateway:
      depends_on:
      - auth
      - billing
      - orchestrator
      portas:
      - 8080
      estado: null
    orchestrator:
      depends_on:
      - db
      portas:
      - 8083
      estado: null
    redis:
      depends_on: []
      portas:
      - 6379
      estado:
        tipo: redis
        gerenciado_aws: ElastiCache
  volumes:
  - postgres_data
  redes:
  - navyr
