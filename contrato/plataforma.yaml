# Contrato da plataforma Navyr — descrição única que os empacotamentos consomem.
#
# GERADO. Não editar à mão: `python3 tests/contract/gerar_contrato.py`.
# A catraca `test_contrato_esta_atualizado.py` reprova quando este arquivo e as
# fontes divergem.
#
# Fontes:
#   variaveis  os.Getenv no código dos serviços — a única fonte que não pode
#              mentir sobre o que o serviço lê
#
#   superficie_configuravel  o subconjunto de `variaveis` que o compose de
#              referência oferece. É o que TODO empacotamento precisa entregar;
#              o resto tem default no código e é botão de ajuste
#   topologia  navyr-deploy/docker-compose.yml — a descrição que roda de fato
#
# Quem consome: docker-compose.yml, chart Helm (navyr-helm) e, quando existir,
# o módulo ECS (navyr-deploy#17). Cada um tem teste que reprova se não cobrir o
# contrato. Ver ADR 0006 e navyr-helm#6 para o porquê.
